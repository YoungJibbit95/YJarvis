name: Baseline CI

on:
  pull_request:
    branches: [main]
  push:
    # Validate migration branches even before a PR event is available.
    branches: [main, "yjv2/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: python-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            apps/agent/requirements.txt
            requirements-dev.txt
      - name: Install native audio libraries (no audio device required)
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libportaudio2 libsndfile1
      - name: Install runtime and development dependencies
        run: python -m pip install -r apps/agent/requirements.txt -r requirements-dev.txt
      - name: Record baseline environment and validate dependencies
        run: |
          git rev-parse HEAD
          python --version
          python -m pip --version
          python -m pip check
          python -m pip freeze
      - name: Run the complete Python test suite
        run: python -m pytest -q

  python-lint:
    name: python-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Check correctness rules without reformatting legacy code
        run: python -m ruff check apps/agent/jarvis_agent tests

  desktop-typecheck:
    name: desktop-typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Static checks do not launch Electron. Normal local installs keep its binary.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install the committed dependency graph
        run: npm ci
      - name: Record Node and npm versions
        run: |
          node --version
          npm --version
      - name: Typecheck the renderer and its shared types
        run: npm run typecheck
      - name: Syntax-check Electron entry points without launching the app
        run: |
          node --check apps/desktop/electron/main.cjs
          node --check apps/desktop/electron/preload.cjs

  desktop-build:
    name: desktop-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install the committed dependency graph
        run: npm ci
      - name: Build the existing Vite renderer
        run: npm run build
      - name: Verify build output and unchanged dependency manifests
        run: |
          test -s apps/desktop/dist/index.html
          git diff --exit-code -- package.json package-lock.json apps/desktop/package.json packages/shared-types/package.json
