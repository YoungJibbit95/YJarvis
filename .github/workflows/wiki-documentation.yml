name: Wiki documentation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-documentation-${{ github.event.pull_request.number || github.ref }}
  # Main publication is serialized. Each build includes the complete history.
  cancel-in-progress: false

jobs:
  wiki-validate:
    name: wiki-validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - run: python -m pip install -r requirements-dev.txt
      - name: Verify history, links and ownership protections
        run: python -m pytest -q tests/documentation
      - name: Build complete wiki preview
        run: python scripts/build_wiki.py --output "$RUNNER_TEMP/wiki-preview"
      - name: Check builder correctness
        run: python -m ruff check scripts/build_wiki.py tests/documentation
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wiki-preview
          path: ${{ runner.temp }}/wiki-preview
          retention-days: 14

  wiki-publish:
    name: wiki-publish
    needs: wiki-validate
    # PRs/forks and dispatches from other branches never receive wiki credentials.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # A queued older run must publish the current main tip, not downgrade it.
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - name: Publish reviewed main sources to existing wiki
        shell: bash
        env:
          WIKI_SYNC_TOKEN: ${{ secrets.WIKI_SYNC_TOKEN }}
          WIKI_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$WIKI_SYNC_TOKEN" ]; then
            echo '::error::Add the dedicated WIKI_SYNC_TOKEN Actions secret with wiki Git write access.'
            exit 1
          fi
          export GIT_TERMINAL_PROMPT=0
          export GIT_ASKPASS="$RUNNER_TEMP/wiki-askpass.sh"
          cat > "$GIT_ASKPASS" <<'ASKPASS'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$WIKI_SYNC_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 "$GIT_ASKPASS"
          trap 'rm -f "$GIT_ASKPASS"' EXIT
          git -c credential.helper= clone "https://github.com/$WIKI_REPOSITORY.wiki.git" "$RUNNER_TEMP/wiki-checkout"
          python scripts/build_wiki.py --managed-only --output "$RUNNER_TEMP/wiki-checkout"
          cd "$RUNNER_TEMP/wiki-checkout"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.md'
          if git diff --cached --quiet; then
            echo 'Wiki already matches main.'
            exit 0
          fi
          source_sha="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          git commit -m "docs: synchronize YJarvis wiki from $source_sha"
          # Normal push rejects concurrent changes; never force or silently retry.
          git -c credential.helper= push origin HEAD
