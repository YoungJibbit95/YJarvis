[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-agent"
version = "0.1.0"
description = "Local Jarvis Python Agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.31.0",
  "pydantic==2.9.2",
  "aiosqlite==0.20.0",
  "httpx==0.27.2",
  "python-multipart==0.0.12",
  "sounddevice==0.5.1",
  "soundfile==0.12.1",
  "piper-tts==1.4.2"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["jarvis_agent*"]
